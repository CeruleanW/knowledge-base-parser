[package]
name = "kbparser"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kbparser"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
anyhow = "1"
regex = "1"
chrono = "0.4"
roxmltree = "0.21"
